# Configuration des générateurs de code (`fvm dart run build_runner build`).
targets:
  $default:
    builders:
      json_serializable:
        options:
          # Sans cette option, `toJson()` renvoie les objets imbriqués tels
          # quels au lieu de les convertir en Map : `CvDocument.fromJson(
          # document.toJson())` échoue alors sur chaque sous-modèle.
          explicit_to_json: true
          # Une clé absente du JSON prend la valeur par défaut du modèle, ce
          # qui permet de relire un CV enregistré avant l'ajout d'un champ.
          include_if_null: false
      drift_dev:
        options:
          # Par défaut, drift stocke une date en secondes Unix et perd les
          # millisecondes : deux sauvegardes rapprochées deviendraient
          # indiscernables. Le texte ISO-8601 conserve la précision.
          store_date_time_values_as_text: true
